# Solai Tide Light

[colors]
background = "#EDF1F4"
foreground = "#2A2D2F"
cursor_bg = "#005476"
cursor_fg = "#FFFFFF"
cursor_border = "#005476"
selection_bg = "#A3C4D1"
selection_fg = "#2A2D2F"
ansi = ["#191C1E", "#AC413A", "#00753A", "#766300", "#0068B9", "#99448C", "#007790", "#B7BBBD"]
brights = ["#626668", "#9C2D2A", "#00652A", "#655400", "#005AAC", "#8A317E", "#006882", "#E4E9EB"]

[metadata]
name = "Solai Tide Light"
